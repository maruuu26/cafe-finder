<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Cafe Finder</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="app-header">
            <h1>cafe finder</h1>
            <button class="secondary-btn" onclick="window.location.href='saved.html'">
                saved cafes
            </button>
        </header>

        <main class="app-main">
            <section class="status">
              <p id="status-text">Allow location access to find nearby cafes.</p>
            </section>

        <section class="card" id="cafe-card" hidden>
            <div class="card-photo-wrapper" id="cafe-photo-wrapper">
                <img
                  id="cafe-photo"
                  class="card-photo"
                  alt="Cafe photo"
                  loading="lazy"
                />
                <div class="card-photo-gradient"></div>
            </div>
            
            <div class="card-body">
                <h2 id="cafe-name"></h2>
                <p id="cafe-address" class="muted"></p>
                <p id="cafe-distance"></p>
                <p id="cafe-category" class="tag"></p>
            
                <div class="card-actions">
                  <button id="skip-btn" class="ghost-btn">skip</button>
                  <button id="save-btn" class="primary-btn">save café</button>
                </div>
            
                <a id="map-link" href="#" target="_blank" rel="noopener" class="map-link">
                  view on map
                </a>
              </div>
        </section>

        <section class="empty-state" id="empty-state" hidden>
            <p>no more cafes found in this area.</p>
            <button class="secondary-btn" id="retry-btn">search again</button>
          </section>
        </main>

        <footer class="app-footer">
            <p><3</p>
        </footer>

        <script src="config.js"></script>
        <script src="script.js"></script>
    </body>
</html>
